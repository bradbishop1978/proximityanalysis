<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Readiness Scorecard — Lula Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F4FB;
      color: #2C023B;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 16px 64px;
    }

    .container { width: 100%; max-width: 480px; }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .app-header h1 {
      font-size: 20px;
      font-weight: 900;
      color: #2C023B;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .app-subtitle {
      text-align: center;
      font-size: 14px;
      color: #7C5D8A;
      margin-bottom: 24px;
      line-height: 1.55;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(44,2,59,.10), 0 1px 4px rgba(44,2,59,.06);
      padding: 28px 24px;
    }

    /* ── Progress ── */
    .progress {
      font-size: 10px;
      font-weight: 600;
      color: #9B7FAC;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 22px;
    }

    /* ── Question ── */
    .q-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #2C023B;
      line-height: 1.3;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }

    /* ── Option buttons ── */
    .opt-btn {
      display: block;
      width: 100%;
      background: #FAF7FC;
      border: 1.5px solid #E8DDF0;
      border-radius: 12px;
      color: #5A4068;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 10px;
      transition: border-color 0.14s, background 0.14s, color 0.14s;
      line-height: 1.4;
    }
    .opt-btn:hover { border-color: #DE4990; background: #FFF0F7; color: #2C023B; }
    .opt-btn.selected { border-color: #DE4990; background: #FFF0F7; color: #DE4990; font-weight: 600; }

    /* ── Back button ── */
    .btn-back {
      display: block;
      width: 100%;
      background: none;
      border: none;
      color: #B39CC0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      cursor: pointer;
      padding: 8px 0;
      text-align: center;
      margin-top: 8px;
      transition: color 0.14s;
    }
    .btn-back:hover { color: #7C5D8A; }

    /* ── Lead capture ── */
    .lead-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #2C023B;
      line-height: 1.3;
      text-align: center;
      margin-bottom: 10px;
    }
    .lead-sub {
      font-size: 13px;
      color: #9B7FAC;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #9B7FAC;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      background: #FAF7FC;
      border: 1.5px solid #E8DDF0;
      border-radius: 10px;
      color: #2C023B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      padding: 14px 16px;
      transition: border-color 0.14s;
    }
    .field input:focus { outline: none; border-color: #DE4990; }
    .field input::placeholder { color: #B39CC0; }

    /* ── Primary CTA ── */
    .btn-cta {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #DE4990 0%, #C0346E 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.14s, transform 0.1s;
      letter-spacing: 0.01em;
      line-height: 1;
      margin-top: 6px;
    }
    .btn-cta:hover:not([disabled]) { opacity: 0.88; transform: translateY(-1px); }
    .btn-cta:active { transform: translateY(0); }

    /* ── Skip link ── */
    .skip-link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #B39CC0;
      cursor: pointer;
      margin-top: 16px;
      text-decoration: none;
      transition: color 0.14s;
    }
    .skip-link:hover { color: #7C5D8A; }

    /* ── Result: band chip ── */
    .band-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 20px;
      padding: 5px 14px;
      margin-bottom: 16px;
    }
    .band-green  { background: rgba(16,185,129,0.10); color: #0d9464; border: 1px solid rgba(16,185,129,0.22); }
    .band-yellow { background: rgba(245,158,11,0.10); color: #c47d08; border: 1px solid rgba(245,158,11,0.22); }
    .band-orange { background: rgba(249,115,22,0.10); color: #c45c10; border: 1px solid rgba(249,115,22,0.22); }

    /* ── Result: score ── */
    .score-wrap { display: flex; align-items: baseline; gap: 6px; margin-bottom: 18px; }
    .score-num {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: 54px;
      line-height: 1;
    }
    .score-denom { font-size: 15px; color: #9B7FAC; }

    /* ── Result: text ── */
    .result-headline {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #2C023B;
      line-height: 1.25;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .result-body {
      font-size: 14px;
      color: #7C5D8A;
      line-height: 1.75;
      margin-bottom: 24px;
    }

    /* ── Revenue block ── */
    .rev-block {
      background: #FFF0F7;
      border: 1.5px solid rgba(222,73,144,0.22);
      border-radius: 16px;
      padding: 22px 20px 20px;
      margin-bottom: 16px;
    }
    .rev-eyebrow {
      font-size: 10px;
      color: #9B7FAC;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.13em;
      margin-bottom: 10px;
    }
    .rev-number {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: #DE4990;
      line-height: 1;
      letter-spacing: -0.01em;
      margin-bottom: 5px;
    }
    .rev-period { font-size: 12px; color: #9B7FAC; margin-bottom: 8px; }
    .rev-total  { font-size: 13px; color: #7C5D8A; }

    /* ── ROI breakdown ── */
    .roi-block {
      background: #FAF7FC;
      border: 1.5px solid #E8DDF0;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .roi-eyebrow {
      font-size: 10px;
      color: #9B7FAC;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }
    .roi-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(44,2,59,0.07);
      font-size: 13px;
    }
    .roi-row:last-child { border-bottom: none; }
    .roi-label { color: #7C5D8A; }
    .roi-val   { font-family: 'Inter', sans-serif; color: #2C023B; font-weight: 500; }
    .roi-row.net .roi-label { color: #2C023B; font-weight: 600; }
    .roi-row.net .roi-val   { color: #10b981; font-weight: 700; }

    /* ── Caveat ── */
    .caveat {
      background: rgba(245,158,11,0.06);
      border: 1px solid rgba(245,158,11,0.18);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #7C5D8A;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    /* ── Low-score note ── */
    .low-note {
      border-left: 3px solid #E8DDF0;
      padding: 10px 14px;
      font-size: 13px;
      color: #7C5D8A;
      line-height: 1.65;
      margin-bottom: 12px;
    }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid #EEE6F2; margin: 22px 0; }

    /* ── Footnote ── */
    .footnote {
      text-align: center;
      font-size: 11px;
      color: #B39CC0;
      line-height: 1.7;
      margin-top: 20px;
    }

    /* ── Fade animation ── */
    .fade-in { animation: fi 0.25s ease both; }
    @keyframes fi { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }

    [hidden] { display: none !important; }

    @media (max-width: 360px) {
      .q-text { font-size: 17px; }
      .result-headline { font-size: 19px; }
      .rev-number { font-size: 28px; }
      .score-num { font-size: 44px; }
    }
  </style>
</head>

<script>
// ── Reference data ──────────────────────────────────────────────────────────

var CTA_ICP_URL      = 'https://onboarding.lulacommerce.com/gen?utm_source=scorecard&utm_medium=wedge';
var CTA_GUIDE_URL    = 'https://bradbishop1978.github.io/lulacommerce_independent-store_Program/?utm_source=scorecard&utm_medium=wedge&utm_campaign=yellow';
var CTA_TYPEFORM_URL = 'https://form.typeform.com/to/XXXXXXXXX'; // replace with live Typeform URL

var QUESTIONS = [
  {
    key: 'locations',
    text: 'How many store locations do you operate?',
    options: [
      { text: '1 location',           value: '1',      pts: 1 },
      { text: '2–5 locations',   value: '2-5',    pts: 2 },
      { text: '6–10 locations',  value: '6-10',   pts: 3 },
      { text: 'More than 10 locations', value: '10plus', pts: 3 }
    ]
  },
  {
    key: 'brand',
    text: 'Which food program does your store carry?',
    options: [
      { text: 'Krispy Krunchy Chicken',     value: 'kkc',      pts: 0 },
      { text: "Chester’s Chicken",     value: 'chesters', pts: 0 },
      { text: 'Hunt Brothers Pizza',        value: 'hunt',     pts: 0 },
      { text: 'Champs Chicken',             value: 'champs',   pts: 0 },
      { text: 'Genuine Broaster Chicken',   value: 'broaster', pts: 0 },
      { text: "We don’t carry a food program", value: 'none', pts: 0 }
    ]
  },
  {
    key: 'pos',
    text: 'Can your store pull a sales report from your point-of-sale system?',
    options: [
      { text: 'Yes — we use SSCS, PDI, or similar', value: 'yes',    pts: 3 },
      { text: 'We have a POS but unsure what it exports', value: 'maybe',  pts: 2 },
      { text: 'Mostly manual or cash-based',              value: 'manual', pts: 1 },
      { text: 'Not sure',                                  value: 'unsure', pts: 1 }
    ]
  },
  {
    key: 'staff',
    text: 'When your store gets busy, how does your team handle it?',
    options: [
      { text: 'We have a dedicated person for food prep',        value: 'dedicated', pts: 3 },
      { text: 'Same staff handles everything but we manage',     value: 'managed',   pts: 2 },
      { text: 'Small team — it gets tight during rush',     value: 'tight',     pts: 1 }
    ]
  },
  {
    key: 'location',
    text: "How would you describe your store’s location?",
    options: [
      { text: 'Urban / City',        value: 'urban',    pts: 3 },
      { text: 'Suburban',            value: 'suburban', pts: 2 },
      { text: 'Rural / Small Town',  value: 'rural',    pts: 1 }
    ]
  }
];

var KEYS = QUESTIONS.map(function(q) { return q.key; });

var BRAND_LABELS = {
  kkc:      'Krispy Krunchy Chicken',
  chesters: "Chester’s Chicken",
  hunt:     'Hunt Brothers Pizza',
  champs:   'Champs Chicken',
  broaster: 'Genuine Broaster Chicken',
  none:     ''
};

// Brand revenue multipliers
var BRAND_MULT = {
  kkc: 1.3, chesters: 1.3, hunt: 1.4, champs: 1.2, broaster: 1.15, none: 1.0
};

// Base monthly ranges per location (conservative single-store actuals)
var REV_BASE = {
  urban:    [800,  1200],
  suburban: [600,  950],
  rural:    [300,  500]
};

// Representative location counts for projection (conservative end of each range)
var LOC_REP = { '1': 1, '2-5': 3, '6-10': 7, '10plus': 10 };

// ── State ────────────────────────────────────────────────────────────────────

var answers = { locations: null, brand: null, pos: null, staff: null, location: null };
var currentQ = 0;

// ── URL param pre-fill ────────────────────────────────────────────────────────

(function() {
  try {
    var p = new URLSearchParams(window.location.search);
    var VALID = {
      locations: { '1':'1','2-5':'2-5','6-10':'6-10','10plus':'10plus' },
      brand:     { kkc:'kkc',chesters:'chesters',hunt:'hunt',champs:'champs',broaster:'broaster',none:'none' },
      pos:       { yes:'yes',maybe:'maybe',manual:'manual',unsure:'unsure' },
      staff:     { dedicated:'dedicated',managed:'managed',tight:'tight' },
      location:  { urban:'urban',suburban:'suburban',rural:'rural' }
    };
    var filled = 0;
    KEYS.forEach(function(k) {
      var v = p.get(k);
      if (v && VALID[k][v]) { answers[k] = VALID[k][v]; filled++; }
    });
    if (filled === 5 && p.get('auto') === '1') {
      document.getElementById('screen-q').hidden = true;
      setTimeout(showResult, 0);
      return;
    }
    // Advance to first unanswered
    for (var i = 0; i < KEYS.length; i++) {
      if (!answers[KEYS[i]]) { currentQ = i; break; }
    }
  } catch(e) {}
  renderQuestion(currentQ);
}());

// ── Question rendering ────────────────────────────────────────────────────────

function renderQuestion(idx) {
  currentQ = idx;
  var q = QUESTIONS[idx];

  document.getElementById('progress-text').textContent = (idx + 1) + ' of 5';
  document.getElementById('q-text').textContent = q.text;

  var wrap = document.getElementById('q-opts');
  wrap.innerHTML = '';
  q.options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'opt-btn' + (answers[q.key] === opt.value ? ' selected' : '');
    btn.textContent = opt.text;
    btn.addEventListener('click', function() { selectOption(q.key, opt.value, btn); });
    wrap.appendChild(btn);
  });

  document.getElementById('btn-back').hidden = (idx === 0);

  var screen = document.getElementById('screen-q');
  screen.hidden = false;
  screen.classList.remove('fade-in');
  void screen.offsetWidth;
  screen.classList.add('fade-in');
}

function selectOption(key, val, btn) {
  document.querySelectorAll('#q-opts .opt-btn').forEach(function(b) {
    b.classList.remove('selected');
  });
  btn.classList.add('selected');
  answers[key] = val;

  setTimeout(function() {
    if (currentQ < 4) {
      renderQuestion(currentQ + 1);
    } else {
      document.getElementById('screen-q').hidden = true;
      document.getElementById('screen-lead').hidden = false;
    }
  }, 260);
}

function goBack() {
  if (currentQ > 0) renderQuestion(currentQ - 1);
}

// ── ICP evaluation ────────────────────────────────────────────────────────────

function evaluateICP() {
  var noFoodBrand  = answers.brand === 'none';
  var isSingle     = answers.locations === '1';
  var isRural      = answers.location  === 'rural';
  var isMulti      = !isSingle;

  if (noFoodBrand)               return { icp: false, reason: 'no-brand' };
  if (isSingle && isRural)       return { icp: false, reason: 'rural-single' };
  return { icp: true, ruralCaveat: isMulti && isRural };
}

// ── Scoring ───────────────────────────────────────────────────────────────────

function calcScore() {
  var total = 0;
  QUESTIONS.forEach(function(q) {
    var val = answers[q.key];
    q.options.forEach(function(opt) {
      if (opt.value === val) total += opt.pts;
    });
  });
  return total;
}

function getOptPts(qIdx, val) {
  var opts = QUESTIONS[qIdx].options;
  for (var i = 0; i < opts.length; i++) {
    if (opts[i].value === val) return opts[i].pts;
  }
  return 0;
}

function getBand(score) {
  if (score >= 10) return 'green';
  if (score >= 7)  return 'yellow';
  return 'orange';
}

// ── Dynamic yellow copy ───────────────────────────────────────────────────────

function getYellowSentence() {
  var q3 = getOptPts(2, answers.pos);
  var q4 = getOptPts(3, answers.staff);
  var issues = [];
  if (q3 <= 1) issues.push('no full POS data');
  if (q4 <= 1) issues.push('limited staff during rush');

  if (issues.length === 2)
    return 'A couple of things you flagged — ' + issues[0] + ' and ' + issues[1] + ' — are managed by Lula on your behalf.';
  if (issues.length === 1)
    return 'Something you flagged — ' + issues[0] + ' — is managed by Lula on your behalf.';

  if (q3 <= q4)
    return 'Your POS setup is something Lula handles directly — no data exports needed.';
  return 'Your staffing situation is something Lula works around — orders flow like any walk-in.';
}

// ── Revenue ───────────────────────────────────────────────────────────────────

function rnd50(n) { return Math.round(n / 50) * 50; }
function fmt(n)   { return '$' + Math.abs(n).toLocaleString(); }

function calcRevenue() {
  var locType  = answers.location  || 'suburban';
  var brandKey = answers.brand     || 'kkc';
  var locsKey  = answers.locations || '1';

  var base  = REV_BASE[locType];
  var mult  = BRAND_MULT[brandKey] || 1.0;
  var count = LOC_REP[locsKey]     || 1;

  var perLo    = rnd50(base[0] * mult);
  var perHi    = rnd50(base[1] * mult);
  var totalLo  = perLo * count;
  var totalHi  = perHi * count;
  var netLo    = Math.round(perLo * 0.9 - 19);
  var netHi    = Math.round(perHi * 0.9 - 19);
  var netTotLo = Math.round(totalLo * 0.9 - 19 * count);
  var netTotHi = Math.round(totalHi * 0.9 - 19 * count);

  return { perLo: perLo, perHi: perHi,
           totalLo: totalLo, totalHi: totalHi,
           count: count, netLo: netLo, netHi: netHi,
           netTotLo: netTotLo, netTotHi: netTotHi };
}

// ── Result rendering ──────────────────────────────────────────────────────────

function showResult() {
  document.getElementById('screen-q').hidden    = true;
  document.getElementById('screen-lead').hidden = true;
  document.getElementById('screen-result').hidden = false;

  var icp     = evaluateICP();
  var content = document.getElementById('result-content');
  content.className = 'fade-in';

  if (!icp.icp) {
    renderNonICP(content, icp.reason);
  } else {
    renderICP(content, icp.ruralCaveat);
  }

  window.scrollTo(0, 0);
}

function renderICP(el, ruralCaveat) {
  var score      = calcScore();
  var band       = getBand(score);
  var rev        = calcRevenue();
  var brandLabel = BRAND_LABELS[answers.brand] || 'your brand';
  var locLabel   = answers.location || 'your';
  var isMulti    = answers.locations !== '1';
  var q3pts      = getOptPts(2, answers.pos);
  var q4pts      = getOptPts(3, answers.staff);

  var BAND_CFG = {
    green:  { chipCls: 'band-green',  label: 'Launch-Ready',  color: '#10b981' },
    yellow: { chipCls: 'band-yellow', label: 'Almost There',  color: '#f59e0b' },
    orange: { chipCls: 'band-orange', label: 'Good Candidate',color: '#f97316' }
  };
  var bc = BAND_CFG[band];

  var headline, body, ctaText;

  var ctaUrl;
  if (band === 'green') {
    headline = 'Your ' + brandLabel + ' location is ready to launch.';
    body     = 'Stores with your profile in ' + locLabel + ' markets typically see ' +
               fmt(rev.perLo) + '–' + fmt(rev.perHi) + ' in monthly delivery funds within 60–90 days on Lula. ' +
               'Setup, menu, orders, and support — all handled. Your team fulfills orders, nothing else changes.';
    ctaText  = 'List My Location — No Cost for 90 Days →';
    ctaUrl   = CTA_ICP_URL;
  } else if (band === 'yellow') {
    headline = 'Your store is a strong candidate.';
    body     = getYellowSentence() + ' Stores like yours in ' + locLabel + ' markets see ' +
               fmt(rev.perLo) + '–' + fmt(rev.perHi) + '/mo once ramped. First 90 days: no platform cost.';
    ctaText  = 'See How It Works →';
    ctaUrl   = CTA_GUIDE_URL;
  } else {
    headline = 'Good news — Lula was built for stores in your situation.';
    body     = 'No full POS data needed. No extra staff. No hardware changes. Your ' + brandLabel + ' menu is pre-built and ready. ' +
               'In your area, stores typically see ' + fmt(rev.perLo) + '–' + fmt(rev.perHi) + '/mo after the ramp period. ' +
               'The first 90 days are on us.';
    ctaText  = 'Get Started — First 90 Days No Cost →';
    ctaUrl   = CTA_GUIDE_URL;
  }

  var h = '';

  // Band + score
  h += '<span class="band-chip ' + bc.chipCls + '">' + bc.label + '</span>';
  h += '<div class="score-wrap">';
  h += '<span class="score-num" style="color:' + bc.color + ';">' + score + '</span>';
  h += '<span class="score-denom">/ 12</span>';
  h += '</div>';

  // Headline + body
  h += '<h2 class="result-headline">' + headline + '</h2>';
  h += '<p class="result-body">' + body + '</p>';

  // Revenue projection (before ROI breakdown per spec)
  h += '<div class="rev-block">';
  h += '<div class="rev-eyebrow">Estimated Monthly Delivery Funds</div>';
  h += '<div class="rev-number">' + fmt(rev.perLo) + ' – ' + fmt(rev.perHi) + '</div>';
  h += '<div class="rev-period">per location &nbsp;·&nbsp; within 60–90 days</div>';
  if (isMulti) {
    h += '<div class="rev-total">' + fmt(rev.totalLo) + ' – ' + fmt(rev.totalHi) +
         ' across ~' + rev.count + ' stores</div>';
  }
  h += '</div>';

  // Primary CTA (full-width, above ROI detail per spec)
  h += '<a href="' + ctaUrl + '" target="_self" class="btn-cta">' + ctaText + '</a>';

  h += '<hr class="divider">';

  // ROI breakdown
  h += '<div class="roi-block">';
  h += '<div class="roi-eyebrow">After the 90-Day No-Cost Period</div>';

  if (isMulti) {
    var totalFee = 19 * rev.count;
    h += '<div class="roi-row"><span class="roi-label">Gross funds (' + rev.count + ' stores)</span><span class="roi-val">' + fmt(rev.totalLo) + '–' + fmt(rev.totalHi) + '/mo</span></div>';
    h += '<div class="roi-row"><span class="roi-label">Platform fee</span><span class="roi-val">–' + fmt(totalFee) + '/mo</span></div>';
    h += '<div class="roi-row"><span class="roi-label">10% revenue share</span><span class="roi-val">–' + fmt(Math.round(rev.totalLo * 0.1)) + '–' + fmt(Math.round(rev.totalHi * 0.1)) + '/mo</span></div>';
    h += '<div class="roi-row net"><span class="roi-label">Net funds</span><span class="roi-val">' + fmt(rev.netTotLo) + '–' + fmt(rev.netTotHi) + '/mo</span></div>';
  } else {
    h += '<div class="roi-row"><span class="roi-label">Gross funds</span><span class="roi-val">' + fmt(rev.perLo) + '–' + fmt(rev.perHi) + '/mo</span></div>';
    h += '<div class="roi-row"><span class="roi-label">Platform fee</span><span class="roi-val">–$19/mo</span></div>';
    h += '<div class="roi-row"><span class="roi-label">10% revenue share</span><span class="roi-val">–' + fmt(Math.round(rev.perLo * 0.1)) + '–' + fmt(Math.round(rev.perHi * 0.1)) + '/mo</span></div>';
    h += '<div class="roi-row net"><span class="roi-label">Net funds</span><span class="roi-val">' + fmt(rev.netLo) + '–' + fmt(rev.netHi) + '/mo</span></div>';
  }
  h += '</div>';

  // Rural caveat for multi-location rural ICP
  if (ruralCaveat) {
    h += '<div class="caveat">Note: Rural markets ramp slower — expect 90–120 days to full delivery volume. The no-cost period is designed to cover this window so you see real performance before committing to anything.</div>';
  }

  // Low-score notes
  if (q3pts <= 1) {
    h += '<div class="low-note">No sales data? Lula uses a pre-built ' + brandLabel + ' menu to get you live immediately while your data catches up.</div>';
  }
  if (q4pts <= 1) {
    h += '<div class="low-note">Lula orders work exactly like walk-in orders — staff bags it, Dasher picks it up. No new role, no new workflow needed.</div>';
  }

  h += '<div class="footnote">Revenue ranges modeled from industry benchmarks. Actual results vary based on menu quality, store hours, and local platform coverage.</div>';

  el.innerHTML = h;
}

function renderNonICP(el, reason) {
  var h = '';

  if (reason === 'no-brand') {
    h += '<h2 class="result-headline">You may be a fit for a different Lula program.</h2>';
    h += "<p class=\"result-body\">Our current delivery program is built around stores carrying specific food brands. If that changes — or if you're considering adding one — we'd love to stay in touch.</p>";
    h += '<a href="' + CTA_TYPEFORM_URL + '" target="_blank" class="btn-cta">Stay in Touch →</a>';
  } else {
    h += '<h2 class="result-headline">Delivery economics are tough in your area right now.</h2>';
    h += "<p class=\"result-body\">Rural markets have limited Dasher availability, which affects how reliably orders get fulfilled. We don't want to set you up for a frustrating experience. As Lula expands into more rural markets, your store is exactly the kind of location we want to bring on. Stay connected:</p>";
    h += '<a href="' + CTA_TYPEFORM_URL + '" target="_blank" class="btn-cta">Stay in Touch →</a>';
  }

  h += '<div class="footnote" style="margin-top:24px;">Questions? <a href="' + CTA_TYPEFORM_URL + '" target="_blank" style="color:rgba(255,255,255,0.35);text-decoration:underline;">Reach out to our team.</a></div>';

  el.innerHTML = h;
}
</script>

</html>
